<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ name }} home">
      {{ site.first_name }}’s notebook
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>
        {% include icon.html name="pocket-notebook" %}<span class="link-label">About me</span>
      </a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url == '/publications/' %}aria-current="page"{% endif %}>
        {% include icon.html name="paper-stack" %}<span class="link-label">Publications</span>
      </a>
      <a href="{{ '/' | relative_url }}#news" {% if page.collection == 'news' %}aria-current="location"{% endif %}>
        {% include icon.html name="newspaper" %}<span class="link-label">News</span>
      </a>
    </nav>
    <div class="header-tools">
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" hidden>
        {% include icon.html name="moon" %}{% include icon.html name="sun" %}
      </button>
    </div>
  </div>
</header>

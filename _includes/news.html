{% assign updates = site.news | sort: 'date' | reverse %}
<ul class="news-list">
  {% for item in updates %}
    <li>
      <time datetime="{{ item.date | date_to_xmlschema }}">{{ item.date | date: '%b %Y' }}</time>
      <div>{% if item.inline %}{{ item.content | markdownify }}{% else %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endif %}</div>
    </li>
  {% endfor %}
</ul>

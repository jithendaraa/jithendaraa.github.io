---
layout: default
---
<article class="shell inner-page news-entry">
  {% if page.collection == 'news' %}<a class="index-link" href="{{ '/' | relative_url }}#news">All news</a>{% endif %}
  <header class="page-intro">
    <h1>{% if page.collection == 'news' %}Research update{% else %}{{ page.title }}{% endif %}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
  </header>
  <div class="prose">{{ content }}</div>
</article>

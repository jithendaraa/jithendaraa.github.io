        &lt;details class=&quot;mm-table-note&quot; id=&quot;mm-warp-cost-model&quot; hidden&gt;
          &lt;summary class=&quot;cursor-interaction&quot; id=&quot;mm-warp-clock&quot;&gt;&lt;/summary&gt;
          &lt;p id=&quot;mm-warp-rates&quot;&gt;&lt;/p&gt;
          &lt;p&gt;Each warp load pays for one L1 lookup. If any sector misses, the L2 row adds the remaining warm-L2 latency once for that instruction. Requests within one instruction can overlap. The L2 write estimate counts one issue cycle per warp store.&lt;/p&gt;
          &lt;p&gt;Each output gets one fused multiply-add (FMA) per dot-product term, worth two FLOPs. Its final update uses one multiply and one FMA. Kernel 4 computes TM outputs per lane. Kernels 5 and 6 compute TM × TN.&lt;/p&gt;
          &lt;p id=&quot;mm-packed-assumptions&quot; hidden&gt;The timing model groups aligned Bs reads into instructions of up to four floats in Kernels 5 and 6. Transposing As lets Kernel 6 group those reads too. Actual shared-load widths depend on the compiler. The model assumes conflict-free shared memory.&lt;/p&gt;
          &lt;p id=&quot;mm-reg-assumptions&quot; hidden&gt;Register counts follow FP32 data values. Tile loads stage through registers. The initial load includes zeroing each output accumulator. Kernel 4 loads one B operand and TM A operands per dotIdx. Kernels 5 and 6 load TM A operands and TN B operands, then execute TM × TN FMAs per lane using those registers. Each FMA reads three operands. Writeback counts old C, intermediate results and the value sent to the store. Uniform scalars and addresses are excluded. Register access is included in instruction timing. Counts assume thread-local values stay in registers. Compiled code can spill large thread tiles.&lt;/p&gt;
          &lt;p id=&quot;mm-fill-assumptions&quot; hidden&gt;L1 reuse retains one 32B sector per read miss. The all-misses setting retains none. L2 read timing includes the fills. Output stores go to L2 in this model.&lt;/p&gt;
          &lt;p&gt;Shared-memory costs assume conflict-free warp instructions, including broadcasts. The combined estimate adds memory and FP32 instruction latencies in sequence. Hardware can overlap work. Barriers, store completion and DRAM misses are outside this estimate. &lt;a id=&quot;mm-warp-benchmark&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GPU microbenchmark ↗&lt;/a&gt;&lt;/p&gt;
        &lt;/details&gt;
        &lt;section id=&quot;mm-matched&quot; aria-labelledby=&quot;mm-matched-title&quot; hidden&gt;
          &lt;div class=&quot;mm-request-heading&quot;&gt;&lt;h3 id=&quot;mm-matched-title&quot;&gt;Full multiplication · Kernel 4 vs. Kernel 5&lt;/h3&gt;&lt;/div&gt;
          &lt;p class=&quot;mm-table-note&quot; id=&quot;mm-matched-shape&quot;&gt;&lt;/p&gt;
          &lt;table class=&quot;mm-comparison-table&quot; aria-labelledby=&quot;mm-matched-title&quot; aria-describedby=&quot;mm-matched-shape mm-matched-note&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;All blocks and warps&lt;/th&gt;&lt;th scope=&quot;col&quot; id=&quot;mm-matched-k4&quot;&gt;Kernel 4&lt;/th&gt;&lt;th scope=&quot;col&quot; id=&quot;mm-matched-k5&quot;&gt;Kernel 5&lt;/th&gt;&lt;th scope=&quot;col&quot; id=&quot;mm-matched-k6&quot; hidden&gt;Kernel 6&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody id=&quot;mm-matched-body&quot;&gt;&lt;/tbody&gt;
          &lt;/table&gt;
          &lt;p class=&quot;mm-table-note&quot; id=&quot;mm-matched-note&quot;&gt;Warp cycles add across warps, which can overlap on the GPU. Each scalar warp store costs one issue cycle here, even when it touches more sectors. Use a hardware measurement for elapsed time.&lt;/p&gt;
        &lt;/section&gt;

      &lt;p class=&quot;mm-sweep-note&quot;&gt;Each plot holds the other tile sizes fixed. Choose a point or cell to use it in the trace. Cycles sum across all warps for the full multiplication. Warps can overlap on hardware.&lt;/p&gt;

  &lt;hr&gt;
  &lt;details class=&quot;mm-notes&quot;&gt;
    &lt;summary class=&quot;cursor-interaction&quot;&gt;Counting and timing assumptions&lt;/summary&gt;
    &lt;div class=&quot;mm-notes-body text-small&quot;&gt;
      &lt;p id=&quot;mm-mapping&quot;&gt;&lt;/p&gt;
      &lt;p id=&quot;mm-traffic-note&quot; hidden&gt;Each global load checks L1 once per 32B sector it touches. Missed sectors in the same 128B line form one modeled L2 request for that load. Shared memory counts individual FP32 reads and writes by the active lanes.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Arithmetic intensity.&lt;/b&gt; The tiled-kernel comparisons follow the same C cells at the same arithmetic progress. Each reference counts the global loads issued by the lanes owning those cells, including their cooperative tile loads. The Kernel 1 and 2 read footprints grow as each cell receives the current term. Kernel 3 uses its selected block size or the largest smaller side that divides M, K and N. When comparing with Kernel 5, Kernel 4 uses the same BM, BN, BK and TM with one output column per thread. Each multiply-accumulate contributes two FLOPs. The final update adds three FLOPs per output, reads its old value and writes the result. Modeled L2 bytes count 32 bytes per sector that misses L1 on a read, plus 32 bytes per sector written to C. The percentages use the full problem’s TAI with ideal reuse.&lt;/p&gt;
      &lt;p id=&quot;mm-reuse&quot;&gt;&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;Coalesced accesses.&lt;/b&gt; For each load or store, count one access per 32 B sector used by two or more active lanes in the warp. Dashes mark the displayed cells that participate. Mint indicates different words in one sector and violet indicates a shared word. The final step counts the read and write of C separately.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;L1 reuse.&lt;/b&gt; Each modeled warp starts with an empty L1. A read brings in just the 32-byte sectors it touches. The trace retains them through the final step and models this warp in isolation. On hardware, other warps can warm or evict sectors. “Assume all L1 misses” sends every read sector to L2.&lt;/p&gt;
      &lt;p&gt;&lt;b&gt;L2 requests.&lt;/b&gt; Each matrix starts on a 128-byte boundary. For each warp load, missed sectors in the same 128-byte line form one L2 request. The four bars on its label show which sectors it fetches. The final step reads old C and separately writes the result. &lt;a href=&quot;https://docs.nvidia.com/nsight-compute/ProfilingGuide/index.html#memory-tables&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;NVIDIA’s memory request definitions&lt;/a&gt;&lt;/p&gt;
      &lt;p id=&quot;mm-model&quot;&gt;&lt;/p&gt;
      &lt;p id=&quot;mm-build&quot;&gt;&lt;/p&gt;

:root:has(#naive-matmul), body:has(#naive-matmul) { color-scheme:light; background:#fff!important }
#naive-matmul {
  --mm-speed:1;
  --background:#fff; --foreground:#202724; --muted-foreground:#5d6863;
  --primary:#223a33; --primary-foreground:#fff; --accent:#edf3ef; --accent-foreground:#253e34;
  --mm-muted:#56625c; --mm-rule:#dce2dd; --mm-paper:#fbfcfa;
  --mm-a:#365d95; --mm-b:#26735f; --mm-c:#ae5335;
  --mm-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --mm-serif:&quot;Iowan Old Style&quot;,&quot;Palatino Linotype&quot;,Palatino,Georgia,serif;
  --mm-hand:MatrixHand,&quot;Chalkboard SE&quot;,cursive;
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;
  color-scheme:light; color:var(--foreground); background:#fff;
  margin:0; width:100%; padding:clamp(6px,1.5vw,26px) max(20px,5%) 18px;
  box-sizing:border-box;
}
#naive-matmul * { box-sizing:border-box }
#naive-matmul .mm-tabs { margin-bottom:clamp(14px,1.7vw,26px); flex-wrap:wrap }
#naive-matmul .mm-addresses { color:var(--mm-muted); font-size:13px }
#mm-addresses { display:grid; gap:4px; padding-top:7px }
#mm-addresses .mm-offsets { color:var(--foreground); font:12px/1.5 var(--mm-mono) }
#mm-addresses .mm-offsets small { display:block; color:var(--mm-muted) }
#naive-matmul header { display:flex; align-items:center; justify-content:space-between; gap:28px; padding-bottom:clamp(17px,2.2vw,32px) }
#naive-matmul .mm-title-block { min-width:0 }
#naive-matmul h1,#naive-matmul h2,#naive-matmul h3 { font-family:var(--mm-serif); font-weight:400; color:var(--foreground) }
#naive-matmul h1 { margin:12px 0 7px; font-size:clamp(34px,3.35vw,54px); line-height:1.05; letter-spacing:-.045em }
#naive-matmul h1 em { font-weight:400 }
#naive-matmul header p { margin:0; font-size:clamp(14px,1.18vw,18px); color:var(--mm-muted) }
#naive-matmul header i { font-family:var(--mm-serif); color:var(--foreground); white-space:nowrap }
#naive-matmul .mm-kicker { font:500 11px/1.45 var(--mm-mono); text-transform:uppercase; letter-spacing:.105em; color:var(--mm-muted) }
#naive-matmul .mm-edition { display:flex; align-items:center; gap:10px }
#naive-matmul .mm-slash { color:#809087 }
#naive-matmul .mm-grid-glyph { width:14px; height:14px; color:var(--mm-b); background:repeating-linear-gradient(90deg,transparent 0 3px,white 3px 5px),repeating-linear-gradient(0deg,currentColor 0 3px,transparent 3px 5px); transform:rotate(-7deg) }
#naive-matmul hr { border:0; border-top:1px solid var(--mm-rule); margin:0 }
#naive-matmul .mm-bounds { flex:0 0 auto; min-width:280px; padding:12px 16px; border:1px solid var(--mm-rule); border-radius:6px; background:var(--mm-paper) }
#naive-matmul .mm-bound-head { display:flex; align-items:baseline; justify-content:space-between; gap:14px }
#naive-matmul .mm-bound-head h3 { font-size:17px; line-height:1.25 }
#naive-matmul .mm-bound-head span { color:var(--mm-muted); font:11px/1.4 var(--mm-mono) }
#naive-matmul .mm-pairs { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; margin:8px 0 0 }
#naive-matmul .mm-pairs div { display:flex; align-items:baseline; gap:8px; justify-content:space-between }
#naive-matmul .mm-pairs dt { font-size:12px; color:var(--mm-muted) }
#naive-matmul .mm-pairs dd { margin:0; font:12px var(--mm-mono) }
#naive-matmul #mm-tai-note { max-width:min(40vw,480px); margin:7px 0 0; font-size:12px; line-height:1.4; color:var(--mm-muted) }
#naive-matmul .mm-columns { display:grid; grid-template-columns:min(52%,880px) minmax(0,1fr); align-items:start; gap:clamp(14px,1.3vw,24px); padding:24px 0 }
#naive-matmul .mm-sidebar { min-width:0; display:grid; grid-template-columns:minmax(0,1fr); gap:22px; container:sidebar / inline-size }
#naive-matmul .mm-main { display:grid; min-width:0; container:board / inline-size }
#naive-matmul .mm-heading,#naive-matmul .mm-workhead { display:flex; align-items:center; justify-content:space-between; gap:12px }
#naive-matmul .mm-heading,#naive-matmul .mm-workhead { min-height:37px; margin-bottom:9px }
#naive-matmul .mm-sidebar h3,#naive-matmul .mm-workhead h2 { font-size:22px; line-height:1.15; letter-spacing:-.025em }
#naive-matmul a { color:#3e6455; text-decoration-color:#acbbb3; text-underline-offset:3px }
#naive-matmul .mm-thread-field { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--mm-muted) }
#naive-matmul .mm-workhead { display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:baseline }
#naive-matmul #mm-block-size-field,#naive-matmul #mm-block-warp-field { white-space:nowrap }
#naive-matmul #mm-block-size { width:6rem }
#naive-matmul #mm-count { width:auto; min-width:60px }
#naive-matmul .mm-shape { color:var(--mm-muted); font-size:14px; padding:4px 0 }
#naive-matmul #mm-shapes { margin-left:6px; font:12px var(--mm-mono) }
#naive-matmul .mm-shape-fields,#naive-matmul .mm-group-controls { display:flex; align-items:center; flex-wrap:wrap; gap:7px 18px; padding:8px 0 }
#mm-register-tiles { display:flex; flex-wrap:wrap; align-items:center; gap:5px 14px; margin:7px 0 3px; padding:4px 0 9px; border:0; border-bottom:1px solid var(--mm-rule) }
#mm-register-tiles[hidden],#mm-register-tiles label[hidden] { display:none }
#mm-register-tiles legend { font:500 14px var(--mm-mono); color:var(--mm-muted); padding:0 }
#mm-register-tiles label { display:flex; align-items:center; gap:5px; font:13px var(--mm-mono) }
#mm-register-tiles select { width:auto; min-width:3.8em }
#mm-tile-summary { color:var(--mm-muted); font-size:13px }
#naive-matmul .mm-shape-fields label { font-size:13px }
#naive-matmul .mm-shape-fields select { width:6.7rem; max-width:100% }
#mm-group-index { width:7rem }
#mm-group-range { font:11px var(--mm-mono) }
#naive-matmul .mm-group-controls { padding:5px 0 12px }
#naive-matmul .mm-thread-picks { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; font:12px var(--mm-mono) }
#naive-matmul .mm-thread-picks [role=&quot;listitem&quot;],#naive-matmul .mm-calculation { display:flex; align-items:center; gap:6px; min-width:0 }
#naive-matmul .mm-thread-picks [data-active=&quot;false&quot;] { color:var(--mm-muted) }
#naive-matmul [data-active=&quot;false&quot;] .mm-dot-paper { fill:#fff }
#naive-matmul [data-active=&quot;false&quot;] .mm-dot-scribble,#naive-matmul [data-active=&quot;false&quot;] .mm-dot-retrace { display:none }
#naive-matmul [data-active=&quot;false&quot;] .mm-dot-outline { stroke-dasharray:3 2 }
#naive-matmul #mm-start { width:auto }
#naive-matmul .mm-thread-field[hidden],#mm-warp-field [hidden] { display:none }
#naive-matmul #mm-view { width:auto }
#naive-matmul[data-large=&quot;true&quot;] .mm-player { border:1px solid var(--mm-rule); border-radius:6px 6px 0 0 }
#naive-matmul[data-large=&quot;true&quot;] .mm-board { border-top:0; border-radius:0 0 6px 6px }
@media(min-width:791px) {
  #naive-matmul[data-large=&quot;true&quot;] .mm-columns { grid-template-columns:minmax(0,36%) minmax(0,1fr) }
}
#naive-matmul .mm-dimension { font-family:var(--mm-mono); font-weight:500 }
#naive-matmul .mm-thread-dot { display:inline-flex; flex:none; width:22px; height:22px }
#naive-matmul .mm-thread-dot svg { display:block; width:100%; height:100% }
#naive-matmul .mm-dot-digit { font-family:var(--mm-hand); fill:#292329; text-anchor:middle; dominant-baseline:central }
#naive-matmul .mm-calculation { gap:8px; line-height:1.25 }
#naive-matmul .mm-lower-calculations:not(:empty) { padding:3px 10px 12px }
#naive-matmul .mm-lower-calculations #mm-equation { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 12px; margin:0 }
#naive-matmul #mm-equation { display:grid; gap:4px }
#naive-matmul .mm-figure .mm-pointer { transition:transform calc(.27s / var(--mm-speed)) ease-out }
@media(prefers-reduced-motion:reduce) { #naive-matmul .mm-figure .mm-pointer { transition:none } }
#naive-matmul .mm-source { margin:0; padding:12px 0; overflow-x:auto; background:#f6f8f6; border-radius:5px; white-space:normal; font:13px/1.6 var(--mm-mono); color:#28332d }
#naive-matmul .mm-source code { display:block; width:max-content; min-width:100%; font:inherit }
#naive-matmul .mm-line { display:grid; grid-template-columns:2.4em minmax(0,1fr); padding:1px 8px 1px 0; border-left:2px solid transparent }
#naive-matmul .mm-line::before { content:attr(data-line); color:#717e76; font:10px/1.8 var(--mm-mono); text-align:right; padding-right:.8em; user-select:none }
#naive-matmul .mm-line[aria-current=&quot;step&quot;] { background:#e1ede5; border-left-color:var(--mm-b) }
#naive-matmul .mm-mapping-line { background:#edf4ee; border-left-color:#acc4b3 }
#naive-matmul .mm-code-text { white-space:pre; overflow-wrap:normal; tab-size:2 }
#naive-matmul .mm-code-text.mm-comment { color:#5f7065; font-style:italic }
#naive-matmul mark { background:none; color:#164b36; font:inherit }
#naive-matmul .mm-mobile-line { display:none }
#naive-matmul .mm-hardware { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:8px; margin:12px 0 8px }
#naive-matmul .mm-context,#naive-matmul .mm-profile { color:var(--mm-muted); font-size:12px }
#naive-matmul .mm-timing { display:flex; align-items:baseline; gap:8px; font:14px/1.55 var(--mm-mono) }

    () => {

        size?.fingerprint === sizeFingerprint &&

    }

  delete frame.dataset.srcdoc;
})();
